name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Read version and stage APK
        id: package
        shell: bash
        run: |
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          if [[ -z "$version_name" ]]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi

          apk_name="Veil-${version_name}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk_name"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "tag=v${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.apk_name }}
          path: ${{ steps.package.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30

  bootstrap-stable-release:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/veil-1.0-stable' && github.repository == 'VicentUCF/Veil'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Generate the stable signing identity and build Veil 1.0
        shell: bash
        env:
          VEIL_PRIVACY_POLICY_URL: https://raw.githubusercontent.com/VicentUCF/Veil/main/docs/PRIVACY_POLICY.md
          VEIL_PRIVACY_CONTACT: vicentciscar17@gmail.com
        run: |
          set -euo pipefail
          umask 077

          key_dir="$RUNNER_TEMP/veil-signing"
          out_dir="$RUNNER_TEMP/veil-bootstrap-output"
          mkdir -p "$key_dir" "$out_dir"

          signing_alias="veil-release"
          signing_password="$(openssl rand -base64 48 | tr -d '\n')"
          echo "::add-mask::$signing_password"

          keytool -genkeypair \
            -keystore "$key_dir/veil-upload.jks" \
            -storetype PKCS12 \
            -storepass "$signing_password" \
            -keypass "$signing_password" \
            -alias "$signing_alias" \
            -keyalg RSA \
            -keysize 4096 \
            -sigalg SHA256withRSA \
            -validity 36500 \
            -dname "CN=Veil, OU=Mobile, O=VicentUCF, L=Favara, ST=Valencia, C=ES"

          VEIL_UPLOAD_STORE_FILE="$key_dir/veil-upload.jks" \
          VEIL_UPLOAD_STORE_PASSWORD="$signing_password" \
          VEIL_UPLOAD_KEY_ALIAS="$signing_alias" \
          VEIL_UPLOAD_KEY_PASSWORD="$signing_password" \
          VEIL_PRIVACY_POLICY_URL="$VEIL_PRIVACY_POLICY_URL" \
          VEIL_PRIVACY_CONTACT="$VEIL_PRIVACY_CONTACT" \
            ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease

          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk_path"
          cp "$apk_path" "$out_dir/Veil-1.0.apk"

          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools_dir/apksigner" verify --verbose --print-certs "$out_dir/Veil-1.0.apk"

          {
            printf 'VEIL_UPLOAD_STORE_PASSWORD=%s\n' "$signing_password"
            printf 'VEIL_UPLOAD_KEY_ALIAS=%s\n' "$signing_alias"
            printf 'VEIL_UPLOAD_KEY_PASSWORD=%s\n' "$signing_password"
          } > "$key_dir/signing.env"

          cat > "$key_dir/README.txt" <<'EOF'
          VEIL STABLE SIGNING BACKUP

          This signing identity must be preserved for every direct APK update.
          Never commit the keystore or signing.env to GitHub.
          Configure the values as GitHub Actions secrets before publishing the next release.
          EOF

          tar -C "$key_dir" -czf "$RUNNER_TEMP/Veil-1.0-signing-backup.tar.gz" \
            veil-upload.jks signing.env README.txt

          openssl rand -base64 48 | tr -d '\n' > "$RUNNER_TEMP/transport.pass"
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 250000 \
            -in "$RUNNER_TEMP/Veil-1.0-signing-backup.tar.gz" \
            -out "$out_dir/Veil-1.0-signing-backup.tar.gz.enc" \
            -pass file:"$RUNNER_TEMP/transport.pass"
          openssl pkeyutl -encrypt -pubin \
            -inkey .github/bootstrap/transport-public.pem \
            -in "$RUNNER_TEMP/transport.pass" \
            -out "$out_dir/Veil-1.0-transport-pass.rsa" \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256

          sha256sum "$out_dir/Veil-1.0.apk" "$out_dir/Veil-1.0-signing-backup.tar.gz.enc"
          rm -rf "$key_dir" "$RUNNER_TEMP/Veil-1.0-signing-backup.tar.gz" "$RUNNER_TEMP/transport.pass"

      - name: Upload stable APK
        uses: actions/upload-artifact@v7
        with:
          name: Veil-1.0-stable-apk
          path: ${{ runner.temp }}/veil-bootstrap-output/Veil-1.0.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload encrypted signing backup
        uses: actions/upload-artifact@v7
        with:
          name: Veil-1.0-signing-backup-encrypted
          path: |
            ${{ runner.temp }}/veil-bootstrap-output/Veil-1.0-signing-backup.tar.gz.enc
            ${{ runner.temp }}/veil-bootstrap-output/Veil-1.0-transport-pass.rsa
          if-no-files-found: error
          retention-days: 1
