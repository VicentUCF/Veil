name: Stable release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: stable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      VEIL_UPLOAD_STORE_PASSWORD: ${{ secrets.VEIL_UPLOAD_STORE_PASSWORD }}
      VEIL_UPLOAD_KEY_ALIAS: ${{ secrets.VEIL_UPLOAD_KEY_ALIAS }}
      VEIL_UPLOAD_KEY_PASSWORD: ${{ secrets.VEIL_UPLOAD_KEY_PASSWORD }}
      VEIL_PRIVACY_POLICY_URL: https://raw.githubusercontent.com/VicentUCF/Veil/main/docs/PRIVACY_POLICY.md
      VEIL_PRIVACY_CONTACT: vicentciscar17@gmail.com

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore signing keystore
        shell: bash
        env:
          VEIL_UPLOAD_KEYSTORE_BASE64: ${{ secrets.VEIL_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          keystore_path="$RUNNER_TEMP/veil-upload.jks"
          test -n "$VEIL_UPLOAD_KEYSTORE_BASE64"
          test -n "$VEIL_UPLOAD_STORE_PASSWORD"
          test -n "$VEIL_UPLOAD_KEY_ALIAS"
          test -n "$VEIL_UPLOAD_KEY_PASSWORD"
          printf '%s' "$VEIL_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "VEIL_UPLOAD_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Test and build signed release APK
        run: ./gradlew --no-daemon clean testDebugUnitTest lintRelease assembleRelease

      - name: Verify and stage APK
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          test -n "$version_name"

          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v${version_name}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match app version v${version_name}." >&2
            exit 1
          fi

          apk_name="Veil-${version_name}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk_name"

          build_tools_dir="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools_dir/apksigner" verify --verbose --print-certs "$apk_name"
          sha256sum "$apk_name"

          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.apk_name }}
          path: ${{ steps.package.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.package.outputs.apk_name }}
          VERSION_NAME: ${{ steps.package.outputs.version_name }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$APK_NAME" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "$APK_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Veil ${VERSION_NAME}" \
              --generate-notes
          fi
